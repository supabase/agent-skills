name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token (this repo)
        id: generate-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.releases_created }}

      - name: Collect skill tags
        id: collect-tags
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          node --input-type=module << 'EOF'
          import { readFileSync, appendFileSync } from 'fs';
          const manifest = JSON.parse(readFileSync('.release-please-manifest.json', 'utf8'));
          const tags = Object.fromEntries(
            Object.entries(manifest).map(([path, version]) => [path.split('/').pop(), `${path}-v${version}`])
          );
          appendFileSync(process.env.GITHUB_OUTPUT, `skill_tags=${JSON.stringify(tags)}\n`);
          EOF

      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.releases_created }}
        with:
          node-version-file: ".node-version"

      - uses: pnpm/action-setup@v5
        if: ${{ steps.release.outputs.releases_created }}

      - name: Install dependencies
        if: ${{ steps.release.outputs.releases_created }}
        run: pnpm install --frozen-lockfile

      - name: Build release artifacts
        if: ${{ steps.release.outputs.releases_created }}
        env:
          SKILL_TAGS: ${{ steps.collect-tags.outputs.skill_tags }}
        run: pnpm build:release

      - name: Upload release assets
        if: ${{ steps.release.outputs.releases_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PATHS_RELEASED='${{ steps.release.outputs.paths_released }}'
          SKILL_TAGS='${{ steps.collect-tags.outputs.skill_tags }}'
          for skill_path in $(echo "$PATHS_RELEASED" | jq -r '.[]'); do
            skill_name=$(basename "$skill_path")
            skill_tag=$(echo "$SKILL_TAGS" | jq -r --arg n "$skill_name" '.[$n]')
            gh release upload "$skill_tag" "dist/${skill_name}.tar.gz" "dist/index.json"
          done

      - name: Generate GitHub App token (supabase-community)
        id: generate-token-plugin
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.GH_APP_ID_SUPABASE_PLUGIN }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY_SUPABASE_PLUGIN }}
          owner: supabase-community
          repositories: supabase-plugin

      - name: Trigger supabase-plugin skill sync
        if: ${{ steps.release.outputs.releases_created }}
        env:
          GH_TOKEN: ${{ steps.generate-token-plugin.outputs.token }}
        run: |
          PATHS_RELEASED='${{ steps.release.outputs.paths_released }}'
          SKILL_TAGS='${{ steps.collect-tags.outputs.skill_tags }}'
          FIRST_SKILL=$(basename "$(echo "$PATHS_RELEASED" | jq -r '.[0]')")
          FIRST_TAG=$(echo "$SKILL_TAGS" | jq -r --arg n "$FIRST_SKILL" '.[$n]')
          gh workflow run sync-agent-skills.yml \
            --repo supabase-community/supabase-plugin \
            --field release_tag="$FIRST_TAG"

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      skill_tags: ${{ steps.collect-tags.outputs.skill_tags }}
    steps:
      - name: Generate GitHub App token (this repo)
        id: generate-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.releases_created }}

      - name: Collect skill tags
        id: collect-tags
        if: ${{ steps.release.outputs.releases_created }}
        env:
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          node --input-type=module << 'EOF'
          import { readFileSync, appendFileSync } from 'fs';
          const manifest = JSON.parse(readFileSync('.release-please-manifest.json', 'utf8'));
          const pathsReleased = JSON.parse(process.env.PATHS_RELEASED);
          const releaseOutputs = JSON.parse(process.env.RELEASE_OUTPUTS);
          const tags = {};
          for (const [skillPath, version] of Object.entries(manifest)) {
            const skillName = skillPath.split('/').pop();
            const outputKey = skillPath.replace(/\//g, '--') + '--tag_name';
            tags[skillName] = pathsReleased.includes(skillPath) && releaseOutputs[outputKey]
              ? releaseOutputs[outputKey]
              : `${skillPath}-v${version}`;
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `skill_tags=${JSON.stringify(tags)}\n`);
          EOF

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release artifacts
        env:
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SKILL_TAGS: ${{ needs.release-please.outputs.skill_tags }}
        run: pnpm build:release

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PATHS_RELEASED='${{ needs.release-please.outputs.paths_released }}'
          SKILL_TAGS='${{ needs.release-please.outputs.skill_tags }}'
          for skill_path in $(echo "$PATHS_RELEASED" | jq -r '.[]'); do
            skill_name=$(basename "$skill_path")
            skill_tag=$(echo "$SKILL_TAGS" | jq -r --arg n "$skill_name" '.[$n]')
            gh release upload "$skill_tag" "dist/${skill_name}.tar.gz" "dist/index.json"
          done

      - name: Generate GitHub App token (supabase-community)
        id: generate-token-plugin
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.GH_APP_ID_SUPABASE_PLUGIN }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY_SUPABASE_PLUGIN }}
          owner: supabase-community
          repositories: supabase-plugin

      - name: Trigger supabase-plugin skill sync
        env:
          GH_TOKEN: ${{ steps.generate-token-plugin.outputs.token }}
        run: |
          PATHS_RELEASED='${{ needs.release-please.outputs.paths_released }}'
          SKILL_TAGS='${{ needs.release-please.outputs.skill_tags }}'
          FIRST_SKILL=$(basename "$(echo "$PATHS_RELEASED" | jq -r '.[0]')")
          FIRST_TAG=$(echo "$SKILL_TAGS" | jq -r --arg n "$FIRST_SKILL" '.[$n]')
          gh workflow run sync-agent-skills.yml \
            --repo supabase-community/supabase-plugin \
            --field release_tag="$FIRST_TAG"

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token (this repo)
        id: generate-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.releases_created }}

      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.releases_created }}
        with:
          node-version-file: ".node-version"

      - uses: pnpm/action-setup@v5
        if: ${{ steps.release.outputs.releases_created }}

      - name: Install dependencies
        if: ${{ steps.release.outputs.releases_created }}
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: resolve-tag
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          FIRST_PATH=$(echo '${{ steps.release.outputs.paths_released }}' | jq -r '.[0]')
          VERSION=$(jq -r --arg p "$FIRST_PATH" '.[$p]' .release-please-manifest.json)
          echo "tag=${FIRST_PATH}-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        if: ${{ steps.release.outputs.releases_created }}
        env:
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: pnpm build:release

      - name: Upload release assets
        if: ${{ steps.release.outputs.releases_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MANIFEST=$(cat .release-please-manifest.json)
          for skill_path in $(echo '${{ steps.release.outputs.paths_released }}' | jq -r '.[]'); do
            version=$(echo "$MANIFEST" | jq -r --arg p "$skill_path" '.[$p]')
            gh release upload "${skill_path}-v${version}" dist/*.tar.gz dist/index.json
          done

      - name: Generate GitHub App token (supabase-community)
        id: generate-token-plugin
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.GH_APP_ID_SUPABASE_PLUGIN }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY_SUPABASE_PLUGIN }}
          owner: supabase-community
          repositories: supabase-plugin

      - name: Trigger supabase-plugin skill sync
        if: ${{ steps.release.outputs.releases_created }}
        env:
          GH_TOKEN: ${{ steps.generate-token-plugin.outputs.token }}
        run: |
          gh workflow run sync-agent-skills.yml \
            --repo supabase-community/supabase-plugin \
            --field release_tag="${{ steps.resolve-tag.outputs.tag }}"
